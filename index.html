<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will Beller â Portfolio</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --surface: #161616;
      --border: #252525;
      --text: #f0f0f0;
      --muted: #666;
      --accent: #d4ff00;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.5;
    }

    /* ââ Header ââ */
    header {
      padding: 56px 48px 44px;
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
    }

    .header-left h1 {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .header-left p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 5px;
    }

    .header-right {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: right;
      line-height: 1.8;
    }

    .header-right a {
      color: var(--accent);
      text-decoration: none;
    }

    .header-right a:hover { text-decoration: underline; }

    /* ââ Brand nav ââ */
    .brand-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(12,12,12,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 48px;
    }

    .brand-nav-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      gap: 0;
    }

    .brand-nav a {
      display: block;
      padding: 14px 20px 12px;
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .brand-nav a:hover {
      color: var(--text);
    }

    .brand-nav a.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ââ Main content ââ */
    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 48px 100px;
    }

    /* ââ Brand section ââ */
    .brand-section {
      padding-top: 64px;
    }

    .brand-section + .brand-section {
      border-top: 1px solid var(--border);
      margin-top: 72px;
    }

    .brand-header {
      margin-bottom: 28px;
    }

    .brand-name {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 18px;
    }

    /* ââ Roles row ââ */
    .roles-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .roles-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-right: 4px;
    }

    .tag {
      font-size: 0.7rem;
      padding: 3px 12px;
      border-radius: 100px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .tag-edited             { background: #0f2010; color: #6fcf6f; border: 1px solid #1e4020; }
    .tag-creative-strategy  { background: #0f1228; color: #7b9fff; border: 1px solid #1a2050; }
    .tag-director           { background: #281010; color: #ff8a8a; border: 1px solid #501a1a; }
    .tag-producer           { background: #201608; color: #ffb347; border: 1px solid #40280a; }
    .tag-cinematography     { background: #0e2222; color: #5ecfcf; border: 1px solid #1a4040; }
    .tag-color-grade        { background: #1c0e28; color: #c97bff; border: 1px solid #38186a; }
    .tag-motion-graphics    { background: #201a08; color: #ffd966; border: 1px solid #40320a; }
    .tag-sound-design       { background: #0e1422; color: #80a8ff; border: 1px solid #1a2648; }
    .tag-head               { background: #220e1a; color: #f07fcf; border: 1px solid #481030; }
    .tag-agency             { background: #1a1a10; color: #e0cc60; border: 1px solid #3a3410; }
    .tag-default            { background: #1c1c1c; color: #888; border: 1px solid #303030; }

    /* ââ Brand description ââ */
    .brand-description {
      font-size: 0.92rem;
      color: #aaa;
      line-height: 1.75;
      max-width: 760px;
    }

    .brand-description.placeholder {
      color: #3a3a3a;
      font-style: italic;
    }

    /* ââ Video grid ââ */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 32px;
    }

    /* ââ Card ââ */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: #3a3a3a;
      transform: translateY(-2px);
    }

    .card-video-wrap {
      width: 100%;
      aspect-ratio: 9/16;
      background: #000;
    }

    .card-video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 18px 20px 20px;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .card-label {
      font-size: 0.66rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
    }

    .card-year {
      font-size: 0.7rem;
      color: var(--muted);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .card-desc {
      font-size: 0.83rem;
      color: #888;
      line-height: 1.65;
      margin-bottom: 14px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* ââ Lite embed (click-to-play) ââ */
    .lite-embed {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
      background: #000;
    }

    .lite-embed img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play-btn {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: transform 0.15s;
    }

    .play-btn:hover { transform: scale(1.08); }

    .lite-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ââ Empty video state ââ */
    .videos-empty {
      margin-top: 32px;
      padding: 40px 28px;
      border: 1px dashed #282828;
      border-radius: var(--radius);
      color: #333;
      font-size: 0.82rem;
      text-align: center;
    }

    /* ââ Responsive ââ */
    @media (max-width: 700px) {
      header {
        padding: 36px 24px 28px;
        flex-direction: column;
        gap: 14px;
        align-items: flex-start;
      }

      .header-right { text-align: left; }
      .brand-nav { padding: 0 24px; }
      main { padding: 0 24px 60px; }
      .brand-section { padding-top: 44px; }
      .brand-section + .brand-section { margin-top: 48px; }
      .video-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
  </style>
</head>
<body>
<header>
  <div class="header-left">
    <h1>Will Beller</h1>
    <p>Video Production &amp; Creative Strategy</p>
  </div>
  <div class="header-right">
    <a href="mailto:wilhelm.beller@gmail.com">wilhelm.beller@gmail.com</a>
  </div>
</header>
<nav class="brand-nav">
  <div class="brand-nav-inner">
    <a href="#pelsbarn">Pelsbarn</a>
    <a href="#katkin">KatKin</a>
    <a href="#petlab-co">PetLab Co.</a>
  </div>
</nav>
<main id="main"></main>
<script>
const BRANDS = [
  {
    id: "pelsbarn",
    name: "Pelsbarn",
    roles: ["Head of Marketing", "Video Editor", "Creative Strategist"],
    description: "I joined Pelsbarn as a Senior Video Editor before progressing into Creative Strategy and, most recently, into the role of Head of Marketing &amp; Brand. The work featured here spans my time as a Video Editor and Creative Strategist â a period defined by high-volume creative output, performance-led thinking, and a consistent hand in shaping the brand's visual identity.",
    videos: [
      { video_url: "https://youtube.com/shorts/6qRAQwt2bAI", title: "Pelsbarn â Video 1", tags: ["Video Editor"] },
      { video_url: "https://youtube.com/shorts/lB-xQm1ZDxI", title: "Pelsbarn â Video 2", tags: ["Video Editor"] },
      { video_url: "https://youtube.com/shorts/JwnLDOvhfSE", title: "Pelsbarn â Video 3", tags: ["Video Editor"] },
      { video_url: "https://youtube.com/shorts/6cz8OVBu70Q", title: "Pelsbarn â Video 4", tags: ["Video Editor"] },
      { video_url: "https://youtube.com/shorts/Kr1BIoq2mvY", title: "Pelsbarn â Video 5", tags: ["Video Editor"] },
      { video_url: "https://youtube.com/shorts/Gwr0U9_YABk", title: "Pelsbarn â Video 6", tags: ["Video Editor"] },
      { video_url: "https://youtube.com/shorts/aUse0K8mn7I", title: "Pelsbarn â Video 7", tags: ["Video Editor"] },
      { video_url: "https://youtube.com/shorts/wvhu5fZGaAQ", title: "Pelsbarn â Video 8", tags: ["Video Editor"] },
      { video_url: "https://youtube.com/shorts/OVeuYCC77VQ", title: "Pelsbarn â Video 9", tags: ["Video Editor"] }
    ]
  },
  {
    id: "katkin",
    name: "KatKin",
    roles: ["Freelance Agency Provider", "Video Editor", "Creative Strategist"],
    description: "My work with KatKin has been delivered through my agency, FSVP. Over three years, we've provided their Meta Growth Team with video editing and creative consultancy â developing a number of long-running, best-performing ads throughout 2024 and 2025. The partnership is grounded in a deep understanding of their audience and a consistent track record of creative that converts.",
    videos: [
      { video_url: "https://youtube.com/shorts/r-MDqRWYN7A", title: "KatKin â Video 1", tags: ["Video Editor", "Creative Strategist"] },
      { video_url: "https://youtube.com/shorts/h1XdsauvpEQ", title: "KatKin â Video 2", tags: ["Video Editor", "Creative Strategist"] },
      { video_url: "https://youtube.com/shorts/abcW0B1EDtg", title: "KaxKin â Video 3", tags: ["Video Editor", "Creative Strategist"] },
      { video_url: "https://youtube.com/shorts/o8nFR5H9phA", title: "KatKin â Video 4", tags: ["Video Editor", "Creative Strategist"] },
      { video_url: "https://youtube.com/shorts/d_lUACfDCXM", title: "KatKin â Video 5", tags: ["Video Editor", "Creative Strategist"] },
      { video_url: "https://youtube.com/shorts/Fbz99fJmX7k", title: "KaxKin â Video 6", tags: ["Video Editor", "Creative Strategist"] }
    ]
  },
  {
    id: "petlab-co",
    name: "PetLab Co.",
    roles: ["Video Editor", "Content Producer"],
    description: "PetLab Co. was my introduction to the DTC eCommerce space â and a formative one. Working directly with the founder and Head of Innovation, I developed a series of high-performing ads that consistently ranked among the brand's top creative. It was an experience that sharpened my instincts for performance creative at scale and gave me a strong foundation in what moves the needle in DTC.",
    videos: [
      { video_url: "https://youtube.com/shorts/ybvUw7EqwhM", title: "PetLab Co. â Video 1", tags: ["Video Editor", "Content Producer"] },
      { video_url: "https://youtube.com/shorts/DJwl6GcbWj0", title: "PetLab Co. â Video 2", tags: ["Video Editor", "Content Producer"] },
      { video_url: "https://youtube.com/shorts/qqKdoMpB3Sc", title: "PetLab Co. â Video 3", tags: ["Video Editor", "Content Producer"] },
      { video_url: "https://youtube.com/shorts/gYLfhS48JUk", title: "PetLab Co. â Video 4", tags: ["Video Editor", "Content Producer"] }
    ]
  }
];
const TAG_CLASSES = {"Edited":"tag-edited","Video Editor":"tag-edited","Creative Strategy":"tag-creative-strategy","Creative Strategist":"tag-creative-strategy","Director":"tag-director","Producer":"tag-producer","Content Producer":"tag-producer","Head of Marketing":"tag-head","Freelance Agency Provider":"tag-agency","Cinematography":"tag-cinematography","Color Grade":"tag-color-grade","Motion Graphics":"tag-motion-graphics","Sound Design":"tag-sound-design"};
function tagClass(t){return TAG_CLASSES[t]||"tag-default";}
function render(){const main=document.getElementById("main");main.innerHTML=BRANDS.map(brand=>{const rolesHTML=brand.roles.length?brand.roles.map(t=>`<span class="tag ${tagClass(t)}">${t}</span>`).join(""):"";const rolesRow=rolesHTML?`<div class="roles-row"><span class="roles-label">My role</span>${rolesHTML}</div>`:`<div class="roles-row"><span class="roles-label" style="color:#2a2a2a">Role to be added</span></div>`;const descHTML=brand.description?`<p class="brand-description">${brand.description}</p>`:`<p class="brand-description placeholder">Description to be added.</p>`;let videosHTML;if(brand.videos.length===0){videosHTML=`<div class="videos-empty">Videos will appear here once uploaded.</div>`;}else{const cards=brand.videos.map(v=>{const embedHTML=(()=>{const url=v.video_url||"";const yt=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/);if(yt){const id=yt[1];return `<div class="lite-embed" data-src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" onclick="loadEmbed(this)"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy"><button class="play-btn" aria-label="Play"><svg viewBox="0 0 48 48" width="52" height="52"><circle cx="24" cy="24" r="23" fill="rgba(0,0,0,0.55)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/><polygon points="20,16 34,24 20,32" fill="#d4ff00"/></svg></button></div>`;}return `<video controls preload="metadata"><source src="${url}" type="video/mp4"></video>`;})();return `<div class="card"><div class="card-video-wrap">${embedHTML}</div></div>`;}).join("");videosHTML<`<div class="video-grid">${cards}</div>`;}return `<section class="brand-section" id="${brand.id}"><div class="brand-header"><h2 class="brand-name">${brand.name}</h2>${rolesRow}${descHTML}</div>${videosHTML}</section>`;}).join("");}
function updateNav(){const sections=document.querySelectorAll(".brand-section");const navLinks=document.querySelectorAll(".brand-nav a");let current="";sections.forEach(s=>{if(window.scrollY>=s.offsetTop-80)current=s.id;});navLinks.forEach(a=>{a.classList.toggle("active",a.getAttribute("href")==="#"+current);});}
function loadEmbed(el){const iframe=document.createElement("iframe");iframe.src=el.dataset.src;iframe.allow="autoplay; fullscreen; picture-in-picture; accelerometer; clipboard-write; encrypted-media; gyroscope";iframe.allowFullscreen=true;el.innerHTML="";el.appendChild(iframe);}
render();
window.addEventListener("scroll",updateNav,{passive:true});
updateNav();
</script>
</body>
</html>
